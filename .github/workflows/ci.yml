name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate formatting, lint, types, and tests
        run: npm run validate

      - name: Build Chromium and Firefox extensions
        run: npm run build

      - name: Upload extension bundles
        uses: actions/upload-artifact@v4
        with:
          name: extension-bundles-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
